[package]
name = "dockex"
version = "1.0.11"
edition = "2024"
authors = ["sinkaroid"]
description = "Docker & Podman Compose orchestration across server fleets"
license = "MIT"
repository = "https://github.com/sinkaroid/dockex"
keywords = ["docker", "podman", "compose", "deployment", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
