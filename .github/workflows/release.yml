name: Release & Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.tag_check.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release metadata
        id: meta
        run: |
          VERSION="$(jq -r .version package.json)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists. Skipping release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is new. Proceeding with release."
          fi

  publish-platforms:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            bin_name: dockex
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            bin_name: dockex
            cross_tool: true
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
            bin_name: dockex
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
            bin_name: dockex
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
            bin_name: dockex.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 cross-linker
        if: matrix.cross_tool == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build Rust binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Setup Node.js (for NPM publish)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Prepare NPM platform package
        run: cargo run --bin xtask -- prepare-platform ${{ matrix.platform }} ${{ matrix.arch }} ${{ needs.check-version.outputs.version }} target/${{ matrix.target }}/release/${{ matrix.bin_name }}

      - name: Publish platform package to NPM
        run: cargo run --bin xtask -- publish npm/${{ matrix.platform }}-${{ matrix.arch }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


      - name: Create archive for GitHub Release (Unix)
        if: matrix.platform != 'win32'
        run: |
          mkdir -p release-assets
          tar -czf release-assets/dockex-${{ needs.check-version.outputs.tag }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.bin_name }}

      - name: Create archive for GitHub Release (Windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -DestinationPath "release-assets/dockex-${{ needs.check-version.outputs.tag }}-${{ matrix.platform }}-${{ matrix.arch }}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockex-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*

  publish-main-and-release:
    needs: [check-version, publish-platforms]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        id: changelog
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          git fetch --tags
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"* %s ([%h]($REPO_URL/commit/%H))" --no-merges)
            COMPARE_URL="$REPO_URL/commit/HEAD"
          else
            NOTES=$(git log --pretty=format:"* %s ([%h]($REPO_URL/commit/%H))" $PREV_TAG..HEAD --no-merges)
            COMPARE_URL="$REPO_URL/compare/$PREV_TAG...$TAG"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "compare_url=$COMPARE_URL" >> $GITHUB_OUTPUT

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update optionalDependencies in package.json
        run: cargo run --bin xtask -- update-deps ${{ needs.check-version.outputs.version }}

      - name: Setup Node.js (for NPM publish)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish main package to NPM
        run: cargo run --bin xtask -- publish .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Node.js (for GitHub Packages)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@sinkaroid"

      - name: Publish main package to GitHub Packages
        continue-on-error: true
        run: cargo run --bin xtask -- publish . https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Create git tag
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: ${{ needs.check-version.outputs.tag }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.notes }}

            **Full Changelog**: ${{ steps.changelog.outputs.compare_url }}
          files: all-assets/*
          target_commitish: master
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
